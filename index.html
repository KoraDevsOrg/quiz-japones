<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aprende Japonés - Retos & Quiz</title>
  <style>
    :root {
      --bg: #0f1115;
      --card-bg: #181c24;
      --border: #2d3342;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --gold: #facc15;
      --correct-bg: rgba(34, 197, 94, 0.15);
      --correct-border: #22c55e;
      --wrong-bg: rgba(239, 68, 68, 0.15);
      --wrong-border: #ef4444;
      --btn-hover: #262c3a;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px 12px;
    }

    header { width: 100%; max-width: 480px; margin-bottom: 16px; }

    .nav-tabs {
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .nav-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .nav-btn.active { background: #272f3f; color: #fff; }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      margin-top: 10px;
      font-size: 0.85rem;
    }

    .stat-item span { font-weight: bold; color: var(--gold); }
    .container { width: 100%; max-width: 480px; }

    /* Tarjeta del Cuestionario */
    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .question-title {
      font-size: 1.25rem;
      line-height: 1.4;
      font-weight: 600;
      margin-bottom: 18px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .star-icon { color: var(--gold); font-size: 1.3rem; }
    .jp-highlight { color: #ffffff; font-weight: 700; border-bottom: 2px dashed var(--gold); }

    .audio-btn {
      background: #252b38;
      border: 1px solid var(--border);
      color: var(--accent);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }

    .options-list { display: flex; flex-direction: column; gap: 10px; }

    .option-btn {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 1.05rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not([disabled]) { background: var(--btn-hover); border-color: #4b5563; }
    .option-btn.correct { background: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: #4ade80 !important; font-weight: bold; }
    .option-btn.wrong { background: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: #f87171 !important; text-decoration: line-through; }

    .explanation-box {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #11141c;
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .explanation-box.correct-exp { border-left: 4px solid var(--correct-border); }
    .explanation-box.wrong-exp { border-left: 4px solid var(--wrong-border); }
    .exp-status { font-weight: bold; margin-bottom: 5px; font-size: 0.95rem; }
    .exp-body { font-size: 0.9rem; color: #d1d5db; line-height: 1.45; }

    .action-btn {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: var(--gold);
      color: #000;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    /* Tarjeta de Sopa de Letras */
    .wordsearch-card {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      text-align: center;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin: 16px auto;
      max-width: 320px;
      user-select: none;
    }

    .cell {
      aspect-ratio: 1;
      background: #232834;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }

    .cell.selected { background: var(--accent); color: #000; }
    .cell.found { background: #22c55e; color: #000; }

    .word-targets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
    .target-tag { background: #212631; border: 1px solid var(--border); padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; }
    .target-tag.done { text-decoration: line-through; color: #6b7280; border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

        🔄 Nueva sopa de letras

    </div>
  </main>

    // GENERAR PREGUNTA ALEATORIA
    function loadQuizQuestion() {
      answered = false;

      const target = dictionary[Math.floor(Math.random() * dictionary.length)];

      const distractors = [];

        const rand = dictionary[Math.floor(Math.random() * dictionary.length)].meaning;
        if (rand !== target.meaning && !distractors.includes(rand)) {
          distractors.push(rand);
        }
      }

      currentQ = {
        jp: target.kana,
        romaji: target.romaji,
        kanji: target.kanji,
        correct: target.meaning,
        options: [...distractors, target.meaning].sort(() => Math.random() - 0.5)
      };

      wordJpEl.textContent = currentQ.jp;
      wordRomajiEl.textContent = currentQ.romaji;

      currentQ.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.onclick = () => verifyAnswer(opt, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function verifyAnswer(selected, btnEl) {
      if (answered) return;
      answered = true;

      const isCorrect = selected === currentQ.correct;
      const allBtns = optionsContainer.querySelectorAll(".option-btn");

      allBtns.forEach(b => {
        b.disabled = true;
        if (b.textContent === currentQ.correct) b.classList.add("correct");
      });

      if (isCorrect) {
        score++;
        streak++;
        btnEl.classList.add("correct");
        expStatus.innerHTML = "✅ ¡Correcto!";
        expStatus.style.color = "#4ade80";
        expBox.className = "explanation-box correct-exp";
      } else {
        streak = 0;
        btnEl.classList.add("wrong");
        expStatus.innerHTML = `❌ Incorrecto`;
        expStatus.style.color = "#f87171";
        expBox.className = "explanation-box wrong-exp";
      }

      document.getElementById("scoreText").textContent = score;
      document.getElementById("streakText").textContent = `${streak} 🔥`;

      let kanjiInfo = (currentQ.kanji && currentQ.kanji !== currentQ.jp) ? `<br>Escritura Kanji: <b>${currentQ.kanji}</b>.` : "";
      expBody.innerHTML = `<b>${currentQ.jp}</b> (${currentQ.romaji}) significa: <i>${currentQ.correct}</i>.${kanjiInfo}`;

      expBox.style.display = "block";
      nextBtn.style.display = "block";
    }

    function playAudio() {
      if (!currentQ || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(currentQ.jp);
      u.lang = 'ja-JP';
      u.rate = 0.8;
      window.speechSynthesis.speak(u);
    }

    // SOPA DE LETRAS DINÁMICA
    let currentSelection = [];
    let foundWords = [];
    let activePuzzleWords = [];

    function initWordSearch() {
      const gridEl = document.getElementById("wsGrid");
      const targetsEl = document.getElementById("wsTargets");
      gridEl.innerHTML = "";
      targetsEl.innerHTML = "";
      currentSelection = [];
      foundWords = [];

      // Selecciona 4 palabras cortas (2 a 3 caracteres) de la lista de 130
      const candidates = dictionary.filter(w => w.kana.length >= 2 && w.kana.length <= 3);
      activePuzzleWords = [...candidates].sort(() => Math.random() - 0.5).slice(0, 4);

      activePuzzleWords.forEach(w => {
        const tag = document.createElement("div");
        tag.className = "target-tag";
        tag.id = `ws-${w.kana}`;
        tag.innerHTML = `<b>${w.kana}</b> (${w.meaning})`;
        targetsEl.appendChild(tag);
      });

      const size = 6;
      let board = Array(size).fill(null).map(() => Array(size).fill(''));
      const fillers = ["あ", "か", "さ", "た", "な", "は", "ま", "や", "ら", "わ", "き", "し", "ち", "に", "り", "て", "こ"];

      activePuzzleWords.forEach((item, rIdx) => {
        const word = item.kana;
        const row = rIdx + 1;
        const maxStart = size - word.length;
        const colStart = Math.floor(Math.random() * (maxStart + 1));
        for (let i = 0; i < word.length; i++) {
          board[row][colStart + i] = word[i];
        }
      });

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (!board[r][c]) {
            board[r][c] = fillers[Math.floor(Math.random() * fillers.length)];
          }
        }
      }

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.textContent = board[r][c];
          cell.onclick = () => handleCellClick(cell);
          gridEl.appendChild(cell);
        }
      }
    }

    function handleCellClick(cell) {
      if (cell.classList.contains("found")) return;

      if (cell.classList.contains("selected")) {
        cell.classList.remove("selected");
        currentSelection = currentSelection.filter(c => c !== cell);
      } else {
        cell.classList.add("selected");
        currentSelection.push(cell);
      }

      const formed = currentSelection.map(c => c.textContent).join("");
      const matched = activePuzzleWords.find(w => w.kana === formed);

      if (matched && !foundWords.includes(matched.kana)) {
        foundWords.push(matched.kana);
        currentSelection.forEach(c => {
          c.classList.remove("selected");
          c.classList.add("found");
        });
        document.getElementById(`ws-${matched.kana}`).classList.add("done");
        currentSelection = [];

        if (foundWords.length === activePuzzleWords.length) {
          setTimeout(() => alert("🎉 ¡Encontraste todas las palabras!"), 200);
        }
      }
    }

    // CAMBIO DE PESTAÑAS
    function switchView(tab) {
      const quizSection = document.getElementById("quizSection");
      const wsSection = document.getElementById("wsSection");
      const tabQuiz = document.getElementById("tabQuiz");
      const tabWordSearch = document.getElementById("tabWordSearch");

      if (tab === 'quiz') {
        quizSection.style.display = "block";
        wsSection.style.display = "none";
        tabQuiz.classList.add("active");
        tabWordSearch.classList.remove("active");
      } else {
        quizSection.style.display = "none";
        wsSection.style.display = "block";
        tabQuiz.classList.remove("active");
        tabWordSearch.classList.add("active");
        initWordSearch();
      }
    }

    // Iniciar con la primera pregunta
    loadQuizQuestion();
  </script>
</body>
