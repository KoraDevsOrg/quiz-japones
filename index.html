<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aprende Japonés - KoraDevs</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header>
    <nav class="nav-tabs" role="tablist">
      <button class="nav-btn active" id="tabQuiz" role="tab" aria-selected="true">🌟 Cuestionario</button>
      <button class="nav-btn" id="tabWordSearch" role="tab" aria-selected="false">🔍 Sopa de Letras</button>
      <button class="nav-btn" id="tabMemory" role="tab" aria-selected="false">🎴 Memoria</button>
    </nav>


    <section class="stats-bar" aria-label="Estadísticas de aprendizaje">
      <div class="stat-item">Aciertos: <span id="scoreText">0</span></div>
      <div class="stat-item">Racha: <span id="streakText">0 🔥</span></div>
      <div class="stat-item">Récord: <span id="bestStreakText">0 🏆</span></div>
      <div class="stat-item">Banco: <span id="vocabCount">0 📚</span></div>
      <button id="btnResetStats" class="btn-icon" title="Reiniciar estadísticas">↺</button>
    </section>
  </header>

  <main class="container">
    <!-- MÓDULO 1: CUESTIONARIO -->
    <section class="quiz-card" id="quizSection">
      <!-- Barra de controles del Quiz -->
      <div class="quiz-toolbar">
        <div class="toolbar-item">
          <label for="categorySelect">Categoría:</label>
          <select id="categorySelect" class="styled-select">
            <option value="all">Todas (130 📚)</option>
            <option value="verbo">Verbos</option>
            <option value="animal">Animales</option>
            <option value="comida">Comida y Bebida</option>
            <option value="objeto">Objetos</option>
            <option value="lugar">Lugares</option>
            <option value="persona">Personas y Familia</option>
            <option value="adjetivo">Adjetivos</option>
            <option value="naturaleza">Naturaleza</option>
            <option value="tiempo">Tiempo</option>
            <option value="frase">Expresiones</option>
            <option value="pregunta">Preguntas</option>
          </select>
        </div>

        <div class="toolbar-item">
          <label for="modeSelect">Modo:</label>
          <select id="modeSelect" class="styled-select">
            <option value="jp-es">🇯🇵 ➔ 🇪🇸</option>
            <option value="es-jp">🇪🇸 ➔ 🇯🇵</option>
            <option value="mixed">🔀 Mixto</option>
          </select>
        </div>

        <button id="btnToggleRomaji" class="toggle-romaji-btn" title="Ocultar/Mostrar Rōmaji">
          👁️ Rōmaji: <span id="romajiStatus">ON</span>
        </button>

        <button id="btnReviewMistakes" class="btn-review" title="Repasar palabras falladas">
          ⚠️ Repaso (<span id="mistakesCount">0</span>)
        </button>
      </div>

      <!-- Banner indicador cuando el modo repaso está activo -->
      <div id="reviewBanner" class="review-badge-banner">
        ⚠️ <b>Modo Repaso Activo:</b> Practicando palabras falladas. ¡Aciértalas para limpiarlas!
      </div>

      <div class="question-header">
        <span class="star-icon" aria-hidden="true">🌟</span>
        <div>
          <h2 class="question-title" id="questionTitleContainer"></h2>
          <button class="audio-btn" id="btnPlayAudio">🔊 Escuchar pronunciación</button>
        </div>
      </div>

      <div class="options-list" id="optionsContainer" role="group" aria-label="Opciones de respuesta"></div>

      <div class="explanation-box" id="explanationBox" aria-live="polite">
        <div class="exp-status" id="expStatus"></div>
        <div class="exp-body" id="expBody"></div>
      </div>

      <button class="action-btn" id="nextBtn" style="display: none;">Siguiente pregunta ➔</button>
    </section>
    

    <!-- MÓDULO 2: SOPA DE LETRAS -->
    <section class="wordsearch-card" id="wsSection" style="display: none;">
      <h3>🔍 Sopa de letras (Hiragana)</h3>
      <p class="section-desc">Selecciona las sílabas en orden (horizontal o vertical) para formar las palabras.</p>

      <div class="grid-container" id="wsGrid"></div>

      <h4>Palabras ocultas:</h4>
      <div class="word-targets" id="wsTargets"></div>

      <button class="action-btn" id="btnResetWS" style="margin-top: 18px;">
        🔄 Nueva sopa de letras
      </button>
    </section>
  </main>

  <!-- Script principal cargado como módulo ES6 -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
