<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aprende Japonés - Conexión Web</title>
  <style>
    :root {
      --bg: #0f1115;
      --card-bg: #181c24;
      --border: #2d3342;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --gold: #facc15;
      --correct-bg: rgba(34, 197, 94, 0.15);
      --correct-border: #22c55e;
      --wrong-bg: rgba(239, 68, 68, 0.15);
      --wrong-border: #ef4444;
      --btn-hover: #262c3a;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px 12px;
    }

    header { width: 100%; max-width: 480px; margin-bottom: 16px; }

    .nav-tabs {
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .nav-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    .nav-btn.active { background: #272f3f; color: #fff; }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      margin-top: 10px;
      font-size: 0.85rem;
    }

    .stat-item span { font-weight: bold; color: var(--gold); }
    .container { width: 100%; max-width: 480px; }

    /* Quiz Card */
    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .question-title {
      font-size: 1.25rem;
      line-height: 1.4;
      font-weight: 600;
      margin-bottom: 18px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .star-icon { color: var(--gold); font-size: 1.3rem; }
    .jp-highlight { color: #ffffff; font-weight: 700; border-bottom: 2px dashed var(--gold); }

    .audio-btn {
      background: #252b38;
      border: 1px solid var(--border);
      color: var(--accent);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }

    .options-list { display: flex; flex-direction: column; gap: 10px; }

    .option-btn {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
    }

    .option-btn:hover:not([disabled]) { background: var(--btn-hover); border-color: #4b5563; }
    .option-btn.correct { background: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: #4ade80 !important; font-weight: bold; }
    .option-btn.wrong { background: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: #f87171 !important; text-decoration: line-through; }

    .explanation-box {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #11141c;
      display: none;
    }

    .explanation-box.correct-exp { border-left: 4px solid var(--correct-border); }
    .explanation-box.wrong-exp { border-left: 4px solid var(--wrong-border); }
    .exp-status { font-weight: bold; margin-bottom: 5px; font-size: 0.95rem; }
    .exp-body { font-size: 0.9rem; color: #d1d5db; line-height: 1.45; }

    .action-btn {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: var(--gold);
      color: #000;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    /* Sopa de Letras */
    .wordsearch-card {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      text-align: center;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin: 16px auto;
      max-width: 320px;
      user-select: none;
    }

    .cell {
      aspect-ratio: 1;
      background: #232834;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: bold;
      cursor: pointer;
    }

    .cell.selected { background: var(--accent); color: #000; }
    .cell.found { background: #22c55e; color: #000; }

    .word-targets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
    .target-tag { background: #212631; border: 1px solid var(--border); padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; }
    .target-tag.done { text-decoration: line-through; color: #6b7280; border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }
  </style>
</head>
<body>

  <header>
    <div class="nav-tabs">
      <button class="nav-btn active" id="tabQuiz" onclick="switchView('quiz')">🌟 Cuestionario</button>
      <button class="nav-btn" id="tabWordSearch" onclick="switchView('wordsearch')">🔍 Sopa de Letras</button>
    </div>

    <div class="stats-bar">
      <div class="stat-item">Aciertos: <span id="scoreText">0</span></div>
      <div class="stat-item">Racha: <span id="streakText">0 🔥</span></div>
      <div class="stat-item">Vocabulario: <span id="vocabCount">Cargando...</span></div>
    </div>
  </header>

  <main class="container">
    <!-- CUESTIONARIO -->
    <div class="quiz-card" id="quizSection">
      <div class="question-title">
        <span class="star-icon">🌟</span>
        <div>
          ¿Qué significa <span class="jp-highlight" id="wordJp">...</span> (<span id="wordRomaji">...</span>)?
          <br>
          <button class="audio-btn" onclick="playAudio()">🔊 Escuchar pronunciación</button>
        </div>
      </div>

      <div class="options-list" id="optionsContainer"></div>

      <div class="explanation-box" id="explanationBox">
        <div class="exp-status" id="expStatus"></div>
        <div class="exp-body" id="expBody"></div>
      </div>

      <button class="action-btn" id="nextBtn" style="display:none;" onclick="loadQuizQuestion()">Siguiente pregunta ➔</button>
    </div>

    <!-- SOPA DE LETRAS -->
    <div class="wordsearch-card" id="wsSection">
      <h3>🔍 Sopa de letras (Hiragana)</h3>
      <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 4px;">
        Toca las letras en orden para formar las palabras.
      </p>

      <div class="grid-container" id="wsGrid"></div>

      <h4 style="font-size: 0.9rem; margin-top: 10px;">Palabras ocultas:</h4>
      <div class="word-targets" id="wsTargets"></div>

      <button class="action-btn" style="margin-top: 16px;" onclick="initWordSearch()">
        🔄 Nueva sopa de letras
      </button>
    </div>
  </main>

  <script>
    let dictionary = [];
    let currentQ = null;
    let score = 0;
    let streak = 0;
    let answered = false;

    const wordJpEl = document.getElementById("wordJp");
    const wordRomajiEl = document.getElementById("wordRomaji");
    const optionsContainer = document.getElementById("optionsContainer");
    const expBox = document.getElementById("explanationBox");
    const expStatus = document.getElementById("expStatus");
    const expBody = document.getElementById("expBody");
    const nextBtn = document.getElementById("nextBtn");
    const vocabCountEl = document.getElementById("vocabCount");

    function toRomaji(kana) {
      const map = {
        'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
        'さ':'sa','し':'shi','す':'su','せ':'se','そ':'so','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
        'な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho',
        'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo',
        'ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'wo','ん':'n',
        'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo',
        'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
        'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po'
      };
      return kana.split('').map(char => map[char] || char).join('');
    }

    // DESCARGA ONLINE DE MÁS DE 650 PALABRAS JLPT N5
    async function fetchOnlineVocab() {
      const remoteUrl = "https://raw.githubusercontent.com/jtauber/jlpt-data/master/json/n5.json";
      try {
        const response = await fetch(remoteUrl);
        if (!response.ok) throw new Error("Fallo de red");
        const data = await response.json();

        // Limpiar y estructurar palabras
        dictionary = data
          .filter(item => item.kana || item.word)
          .map(item => {
            const kana = item.kana || item.word;
            return {
              kana: kana,
              romaji: toRomaji(kana),
              kanji: item.kanji || item.word,
              meaning: item.meaning.toLowerCase()
            };
          });

        vocabCountEl.textContent = `${dictionary.length} (Online)`;
      } catch (e) {
        // Respaldo inmediato si no hay internet
        dictionary = [
          { kana: "およぐ", romaji: "oyogu", kanji: "泳ぐ", meaning: "nadar" },
          { kana: "たべる", romaji: "taberu", kanji: "食べる", meaning: "comer" },
          { kana: "のむ", romaji: "nomu", kanji: "飲む", meaning: "beber" },
          { kana: "ねこ", romaji: "neko", kanji: "猫", meaning: "gato" },
          { kana: "いぬ", romaji: "inu", kanji: "犬", meaning: "perro" },
          { kana: "ほん", romaji: "hon", kanji: "本", meaning: "libro" },
          { kana: "みず", romaji: "mizu", kanji: "水", meaning: "agua" }
        ];
        vocabCountEl.textContent = `${dictionary.length} (Offline)`;
      }

      loadQuizQuestion();
    }

    // CUESTIONARIO DINÁMICO
    function loadQuizQuestion() {
      answered = false;
      expBox.style.display = "none";
      nextBtn.style.display = "none";
      optionsContainer.innerHTML = "";

      const target = dictionary[Math.floor(Math.random() * dictionary.length)];

      const distractors = [];
      while (distractors.length < 3) {
        const d = dictionary[Math.floor(Math.random() * dictionary.length)].meaning;
        if (d !== target.meaning && !distractors.includes(d)) {
          distractors.push(d);
        }
      }

      currentQ = {
        jp: target.kana,
        romaji: target.romaji,
        kanji: target.kanji !== target.kana ? target.kanji : null,
        correct: target.meaning,
        options: [...distractors, target.meaning].sort(() => Math.random() - 0.5)
      };

      wordJpEl.textContent = currentQ.jp;
      wordRomajiEl.textContent = currentQ.romaji;

      currentQ.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.onclick = () => verifyAnswer(opt, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function verifyAnswer(selected, btnEl) {
      if (answered) return;
      answered = true;

      const isCorrect = selected === currentQ.correct;
      const allBtns = optionsContainer.querySelectorAll(".option-btn");

      allBtns.forEach(b => {
        b.disabled = true;
        if (b.textContent === currentQ.correct) b.classList.add("correct");
      });

      if (isCorrect) {
        score++;
        streak++;
        btnEl.classList.add("correct");
        expStatus.innerHTML = "✅ ¡Correcto!";
        expStatus.style.color = "#4ade80";
        expBox.className = "explanation-box correct-exp";
      } else {
        streak = 0;
        btnEl.classList.add("wrong");
        expStatus.innerHTML = `❌ Incorrecto (Correcto: ${currentQ.correct})`;
        expStatus.style.color = "#f87171";
        expBox.className = "explanation-box wrong-exp";
      }

      document.getElementById("scoreText").textContent = score;
      document.getElementById("streakText").textContent = `${streak} 🔥`;

      let kanjiInfo = currentQ.kanji ? `<br>Escritura Kanji: <b>${currentQ.kanji}</b>.` : "";
      expBody.innerHTML = `<b>${currentQ.jp}</b> (${currentQ.romaji}) significa: <i>${currentQ.correct}</i>.${kanjiInfo}`;

      expBox.style.display = "block";
      nextBtn.style.display = "block";
    }

    function playAudio() {
      if (!currentQ || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(currentQ.jp);
      u.lang = 'ja-JP';
      u.rate = 0.8;
      window.speechSynthesis.speak(u);
    }

    // SOPA DE LETRAS DINÁMICA
    let currentSelection = [];
    let foundWords = [];
    let activePuzzleWords = [];

    function initWordSearch() {
      const gridEl = document.getElementById("wsGrid");
      const targetsEl = document.getElementById("wsTargets");
      gridEl.innerHTML = "";
      targetsEl.innerHTML = "";
      currentSelection = [];
      foundWords = [];

      // Selecciona palabras de 2 a 4 caracteres directamente de la lista descargada
      const validPool = dictionary.filter(w => w.kana.length >= 2 && w.kana.length <= 4);
      activePuzzleWords = [...validPool].sort(() => Math.random() - 0.5).slice(0, 4);

      activePuzzleWords.forEach(w => {
        const tag = document.createElement("div");
        tag.className = "target-tag";
        tag.id = `ws-${w.kana}`;
        tag.innerHTML = `<b>${w.kana}</b> (${w.meaning.split('/')[0].trim()})`;
        targetsEl.appendChild(tag);
      });

      const size = 6;
      let board = Array(size).fill(null).map(() => Array(size).fill(''));
      const fillers = ["あ", "か", "さ", "た", "な", "は", "ま", "や", "ら", "わ", "き", "し", "ち", "に", "り", "て", "こ"];

      activePuzzleWords.forEach((item, rIdx) => {
        const word = item.kana;
        const row = rIdx + 1;
        const maxStart = size - word.length;
        const colStart = Math.floor(Math.random() * (maxStart + 1));
        for (let i = 0; i < word.length; i++) {
          board[row][colStart + i] = word[i];
        }
      });

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (!board[r][c]) {
            board[r][c] = fillers[Math.floor(Math.random() * fillers.length)];
          }
        }
      }

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.textContent = board[r][c];
          cell.onclick = () => handleCellClick(cell);
          gridEl.appendChild(cell);
        }
      }
    }

    function handleCellClick(cell) {
      if (cell.classList.contains("found")) return;

      if (cell.classList.contains("selected")) {
        cell.classList.remove("selected");
        currentSelection = currentSelection.filter(c => c !== cell);
      } else {
        cell.classList.add("selected");
        currentSelection.push(cell);
      }

      const formed = currentSelection.map(c => c.textContent).join("");
      const matched = activePuzzleWords.find(w => w.kana === formed);

      if (matched && !foundWords.includes(matched.kana)) {
        foundWords.push(matched.kana);
        currentSelection.forEach(c => {
          c.classList.remove("selected");
          c.classList.add("found");
        });
        document.getElementById(`ws-${matched.kana}`).classList.add("done");
        currentSelection = [];

        if (foundWords.length === activePuzzleWords.length) {
          setTimeout(() => alert("🎉 ¡Encontraste todas las palabras!"), 250);
        }
      }
    }

    function switchView(tab) {
      const quizSection = document.getElementById("quizSection");
      const wsSection = document.getElementById("wsSection");
      const tabQuiz = document.getElementById("tabQuiz");
      const tabWordSearch = document.getElementById("tabWordSearch");

      if (tab === 'quiz') {
        quizSection.style.display = "block";
        wsSection.style.display = "none";
        tabQuiz.classList.add("active");
        tabWordSearch.classList.remove("active");
      } else {
        quizSection.style.display = "none";
        wsSection.style.display = "block";
        tabQuiz.classList.remove("active");
        tabWordSearch.classList.add("active");
        initWordSearch();
      }
    }

    // Inicialización
    fetchOnlineVocab();
  </script>
</body>
</html>
